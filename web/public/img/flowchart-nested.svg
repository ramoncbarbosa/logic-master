<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-labelledby="t"><title id="t">Fluxograma de decisão aninhada: media recebe 8; se media maior ou igual a 7, testa se media maior ou igual a 9 para escrever Excelente ou Aprovado; senão escreve Reprovado</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d366b"/></marker></defs><rect width="600" height="560" fill="#fff"/><rect x="245" y="15" width="110" height="40" rx="20" fill="#d3f2e5" stroke="#0d366b" stroke-width="2.5"/><text x="300" y="41" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">Início</text><line x1="300" y1="55" x2="300" y2="85" stroke="#0d366b" stroke-width="2.5" marker-end="url(#a)"/><rect x="215.0" y="85.0" width="170" height="46" rx="6" fill="#cde2fb" stroke="#0d366b" stroke-width="2.5"/><text x="300" y="114" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" fill="#0b0b0b">media ← 8</text><line x1="300" y1="131" x2="300" y2="160" stroke="#0d366b" stroke-width="2.5" marker-end="url(#a)"/><polygon points="300,161.0 410.0,205 300,249.0 190.0,205" fill="#fde9b8" stroke="#0d366b" stroke-width="2.5"/><text x="300" y="211" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" fill="#0b0b0b">media ≥ 7 ?</text><polyline points="190,205 180,205 180,280" fill="none" stroke="#0d366b" stroke-width="2.5" marker-end="url(#a)"/><text x="150" y="195" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#52514e">SIM</text><polyline points="410,205 490,205 490,420" fill="none" stroke="#0d366b" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="195" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#52514e">NÃO</text><polygon points="180,281.0 290.0,325 180,369.0 70.0,325" fill="#fde
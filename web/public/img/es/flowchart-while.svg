<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t"><title id="t">Diagrama de flujo del bucle mientras: contador recibe 3; mientras contador sea mayor que 0, escribe contador y resta 1; luego termina</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d366b"/></marker></defs><rect width="560" height="520" fill="#fff"/><rect x="175" y="15" width="110" height="40" rx="20" fill="#d3f2e5" stroke="#0d366b" stroke-width="2.5"/><text x="230" y="41" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">Inicio</text><line x1="230" y1="55" x2="230" y2="85" stroke="#0d366b" stroke-width="2.5" marker-end="url(#a)"/><rect x="145.0" y="85.0" width="170" height="46" rx="6" fill="#cde2fb" stroke="#0d366b" stroke-width="2.5"/><text x="230" y="114" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" fill="#0b0b0b">contador ← 3</text><line x1="230" y1="131" x2="230" y2="165" stroke="#0d366b" stroke-width="2.5" marker-end="url(#a)"/><polygon points="230,167.0 335.0,215 230,263.0 125.0,215" fill="#fde9b8" stroke="#0d366b" stroke-width="2.5"/><text x="230" y="221" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" fill="#0b0b0b">contador > 0 ?</text><line x1="230" y1="263" x2="230" y2="300" stroke="#0d366b" stroke-width="2.5" marker-end="url(#a)"/><text x="240" y="288" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#52514e">SÍ</text><rect x="110.0" y="300.0" width="240" height="46" rx="6" fill="#cde2fb" stroke="#0d366b" stroke-width="2.5"/><text x="230" y="329" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#0b0b0b">escribir(contador)</text><line x1="230" y1="346" x2="230" y2="380" stroke="#0d366b" stroke-width="2.5" marker-end="url(#a)"/><rect x="110.0" y="380.0" width="240" height="46" rx="6" fill="#cde2fb" stroke="#0d366b" stroke-width="2.5"/><text x="230" y="409" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#0b0b0b">contador ← contador - 1</text><polyline points="110,403 50,403 50,215 125,215" fill="none" stroke="#0d366b" stroke-width="2.5" marker-end="url(#a)"/><polyline points="335,215 440,215 440,440" fill="none" stroke="#0d366b" stroke-width="2.5" marker-end="url(#a)"/><text x="350" y="205" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#52514e">NO</text><rect x="385" y="442" width="110" height="40" rx="20" fill="#d3f2e5" stroke="#0d366b" stroke-width="2.5"/><text x="440" y="468" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">Fin</text></svg>
